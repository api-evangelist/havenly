aid: havenly
name: Havenly
description: >-
  Havenly is an online interior-design platform that connects clients with professional
  designers for virtual and in-person home-decorating services. Clients take a style quiz,
  match with a designer, collaborate on 3D room renderings, and shop curated furniture and
  decor from partner brands at exclusive prices. Havenly also offers AI-assisted design.
  The company exposes a REST API (documented publicly via Postman at api-docs.havenly.com)
  covering users and profiles, addresses, design boards and board products, a vendor product
  catalog (vendor variants), attribute types, board feedback, and user opinions/likes.
  Authentication is OAuth2 (password grant) returning a Bearer token; HAL+JSON responses use
  page/limit pagination and zf-doctrine-querybuilder query filters. Havenly is backed by
  500 Global and Foundry Group.
