openapi: 3.0.3
info:
  title: Havenly Addresses Board Products API
  version: 1.0.0
  description: 'Havenly REST API powering the interior-design platform: users and profiles, addresses, design boards and board products, vendor product variants (catalog), attribute types, board feedback, and user opinions/likes. Responses use HAL+JSON (_links/_embedded) with page/limit pagination and zf-doctrine-querybuilder query filters. Authentication is OAuth2 (password grant) returning a Bearer token; payment testing in non-production uses Stripe test cards. Derived from Havenly public Postman API documentation at https://api-docs.havenly.com.'
  contact:
    email: developers@havenly.com
    url: https://api-docs.havenly.com/
servers:
- url: https://api.havenly.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Board Products
paths:
  /board-products:
    post:
      operationId: createBoardProduct
      summary: Create Board Product
      tags:
      - Board Products
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
      description: Route used to add a product to a board.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              recommendedQty: 5
              board: 52087
              vendorVariant: 7759999
              status: 2
      security:
      - bearerAuth: []
  /board-products/{id}:
    get:
      operationId: getASpecificBoardProductById
      summary: Get a Specific Board Product by ID
      tags:
      - Board Products
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
      description: Get a specific board product by board product ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              recommendedQty: 5
              board_id: 29781
              vendor_variant_id: 1
      security:
      - bearerAuth: []
